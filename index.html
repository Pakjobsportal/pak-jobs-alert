<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="286224f5c712a9048b99cdf2fcb30bbf8eda0c78" content="286224f5c712a9048b99cdf2fcb30bbf8eda0c78" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E5C7E37QX2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-E5C7E37QX2');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Jobs Alert - Official Job Portal</title>
    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-emerald-500/20">
                    🇵🇰
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-slate-900 leading-tight">Pak Jobs Alert</h1>
                    <p class="text-[11px] text-emerald-600 font-semibold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Verified Portal
                    </p>
                </div>
            </div>
            <a href="admin.html" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors text-xs font-semibold">
                ⚙️ Admin
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
        
        <!-- Hero Banner Card -->
        <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-emerald-700 via-emerald-600 to-teal-800 p-5 text-white shadow-xl shadow-emerald-900/10">
            <div class="relative z-10 space-y-1.5">
                <span class="inline-block px-2.5 py-0.5 rounded-full bg-white/15 backdrop-blur-md text-[10px] font-bold tracking-wide uppercase text-emerald-100 border border-white/10">
                    Latest Opportunities
                </span>
                <h2 class="text-xl font-extrabold tracking-tight">Find Your Next Career Opportunity</h2>
                <p class="text-xs text-emerald-100/90 leading-relaxed">Daily verified Government, Private & Forces job listings across Pakistan.</p>
            </div>
            <!-- Decorative BG Circles -->
            <div class="absolute -right-6 -bottom-6 w-32 h-32 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
            <div class="absolute -left-6 -top-6 w-24 h-24 rounded-full bg-teal-400/20 blur-xl pointer-events-none"></div>
        </div>

        <!-- Top Ad Container (Loaded from Firebase) -->
        <div id="topAdContainer" class="w-full"></div>

        <!-- Search & Filter Bar -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200/80 space-y-3">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                    🔍
                </span>
                <input type="text" id="searchInput" placeholder="Search by title, role or city..." 
                       class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all placeholder:text-slate-400">
            </div>
            
            <!-- Category Pills -->
            <div class="flex gap-1.5 overflow-x-auto pb-0.5 no-scrollbar">
                <button onclick="filterCategory('All')" data-cat="All" class="cat-btn shrink-0 bg-emerald-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm shadow-emerald-600/30 transition-all">
                    All Jobs
                </button>
                <button onclick="filterCategory('Government')" data-cat="Government" class="cat-btn shrink-0 bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all">
                    🏛️ Govt
                </button>
                <button onclick="filterCategory('Private')" data-cat="Private" class="cat-btn shrink-0 bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all">
                    💼 Private
                </button>
                <button onclick="filterCategory('Forces')" data-cat="Forces" class="cat-btn shrink-0 bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all">
                    🎖️ Forces
                </button>
            </div>
        </div>

        <!-- Jobs List Section Header -->
        <div class="flex items-center justify-between px-1">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Available Listings</h3>
            <span id="jobCount" class="text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">0 Jobs</span>
        </div>

        <!-- Job Cards Container -->
        <div id="jobsList" class="space-y-3">
            <div class="bg-white rounded-2xl p-6 text-center shadow-sm border border-slate-200/80 space-y-2">
                <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-lg">
                    ⏳
                </div>
                <p class="text-xs font-medium text-slate-500">Loading latest job listings...</p>
            </div>
        </div>

    </main>

    <!-- Job Details Modal Popup -->
    <div id="jobModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 hidden transition-opacity">
        <div class="bg-white rounded-t-3xl sm:rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto border border-slate-100">
            
            <div class="flex justify-between items-start gap-3 border-b border-slate-100 pb-3">
                <div class="space-y-1">
                    <span id="modalCategory" class="inline-block px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold"></span>
                    <h3 id="modalTitle" class="text-base font-extrabold text-slate-900 leading-snug"></h3>
                    <p id="modalLocation" class="text-xs text-slate-500 font-medium flex items-center gap-1">📍 <span></span></p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-sm shrink-0">
                    ✕
                </button>
            </div>
            
            <div class="space-y-1.5">
                <h4 class="text-xs font-bold text-slate-900">Job Description & Details:</h4>
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/60 text-xs text-slate-700 whitespace-pre-wrap leading-relaxed font-normal" id="modalDescription"></div>
            </div>

            <div id="modalApplyContainer" class="pt-1"></div>

            <button onclick="closeModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2.5 rounded-xl transition-colors">
                Close Details
            </button>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AiZaSyDNuCCC577Pul4Gvn3_fX1m23-9tSmsWSo",
            authDomain: "pakjobsalert-fae89.firebaseapp.com",
            projectId: "pakjobsalert-fae89",
            storageBucket: "pakjobsalert-fae89.firebasestorage.app",
            messagingSenderId: "935845790400",
            appId: "1:935845790400:web:98d35b91b94eaeb01ff1a9",
            measurementId: "G-E5C7E37QX2"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let allJobs = [];
        let globalAds = { ad1: '', ad2: '' };
        let selectedCategory = 'All';

        // Load Ads from Firebase
        const adsRef = ref(database, 'settings/ads');
        onValue(adsRef, (snapshot) => {
            if (snapshot.exists()) {
                globalAds = snapshot.val();
                if (globalAds.ad1) {
                    document.getElementById('topAdContainer').innerHTML = `<div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">${globalAds.ad1}</div>`;
                } else {
                    document.getElementById('topAdContainer').innerHTML = '';
                }
            }
            renderJobs();
        });

        // Load Jobs from Firebase
        const jobsRef = ref(database, 'jobs');
        onValue(jobsRef, (snapshot) => {
            const container = document.getElementById('jobsList');
            container.innerHTML = '';

            if (snapshot.exists()) {
                const data = snapshot.val();
                allJobs = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                allJobs.sort((a, b) => b.timestamp - a.timestamp);
                renderJobs();
            } else {
                document.getElementById('jobCount').innerText = '0 Jobs';
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center shadow-sm border border-slate-200/80 space-y-2">
                        <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto text-xl">
                            📋
                        </div>
                        <h4 class="text-sm font-bold text-slate-800">No Jobs Posted Yet</h4>
                        <p class="text-xs text-slate-500 max-w-xs mx-auto">Check back soon or post jobs from the Admin Panel to display listings here.</p>
                    </div>
                `;
            }
        });

        function renderJobs() {
            const container = document.getElementById('jobsList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            container.innerHTML = '';

            const filtered = allJobs.filter(job => {
                const matchesCat = (selectedCategory === 'All') || (job.category === selectedCategory);
                const matchesSearch = job.title.toLowerCase().includes(searchVal) || job.location.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            document.getElementById('jobCount').innerText = `${filtered.length} Jobs`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center shadow-sm border border-slate-200/80 space-y-1.5">
                        <p class="text-xs font-bold text-slate-700">No matching jobs found</p>
                        <p class="text-[11px] text-slate-400">Try searching for a different keyword or category.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((job, index) => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200/80 p-4 rounded-2xl shadow-sm hover:shadow-md hover:border-emerald-300 transition-all flex justify-between items-center group cursor-pointer";
                card.onclick = () => openModal(job.id);
                
                card.innerHTML = `
                    <div class="pr-3 space-y-1.5 min-w-0">
                        <span class="inline-block px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 text-[10px] font-bold">
                            ${job.category}
                        </span>
                        <h3 class="font-extrabold text-slate-900 text-xs sm:text-sm truncate group-hover:text-emerald-600 transition-colors">
                            ${job.title}
                        </h3>
                        <p class="text-[11px] text-slate-500 font-medium flex items-center gap-1 truncate">
                            📍 ${job.location}
                        </p>
                    </div>
                    <button class="bg-emerald-50 text-emerald-700 group-hover:bg-emerald-600 group-hover:text-white text-xs font-bold px-3.5 py-2 rounded-xl shrink-0 transition-all">
                        View
                    </button>
                `;
                container.appendChild(card);

                // Insert Ad 2 automatically after every 2 posts (index 1, 3, 5, etc.)
                if ((index + 1) % 2 === 0 && globalAds.ad2 && globalAds.ad2.trim() !== '') {
                    const adCard = document.createElement('div');
                    adCard.className = "bg-white p-2 rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden my-3";
                    adCard.innerHTML = globalAds.ad2;
                    container.appendChild(adCard);
                }
            });
        }

        document.getElementById('searchInput').addEventListener('input', renderJobs);

        window.filterCategory = function(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn shrink-0 bg-emerald-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm shadow-emerald-600/30 transition-all";
                } else {
                    btn.className = "cat-btn shrink-0 bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all";
                }
            });
            renderJobs();
        };

        window.openModal = function(id) {
            const job = allJobs.find(j => j.id === id);
            if (!job) return;

            document.getElementById('modalTitle').innerText = job.title;
            document.getElementById('modalCategory').innerText = job.category;
            document.getElementById('modalLocation').innerHTML = `<span>${job.location}</span>`;
            document.getElementById('modalDescription').innerText = job.description;

            const applyContainer = document.getElementById('modalApplyContainer');
            applyContainer.innerHTML = '';

            if (job.applyLink && job.applyLink.trim() !== '') {
                const val = job.applyLink.trim();
                let buttonHtml = '';

                if (/^[0-9+\s-]+$/.test(val)) {
                    buttonHtml = `
                        <a href="tel:${val}" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white text-xs font-extrabold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition-all mb-2">
                            📞 Direct Call / Contact: ${val}
                        </a>`;
                } else {
                    let url = val;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        url = 'https://' + url;
                    }
                    buttonHtml = `
                        <a href="${url}" target="_blank" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white text-xs font-extrabold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition-all mb-2">
                            👉 Apply Online / Official Contact Link
                        </a>`;
                }
                applyContainer.innerHTML = buttonHtml;
            }

            document.getElementById('jobModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('jobModal').classList.add('hidden');
        };
    </script>
</body>
</html>
