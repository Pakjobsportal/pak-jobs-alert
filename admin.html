<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pak Jobs Alert</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 pb-12">

    <!-- 1. Password Lock Screen Modal -->
    <div id="authModal" class="fixed inset-0 bg-gray-900 bg-opacity-95 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 max-w-xs w-full shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                🔒
            </div>
            <div>
                <h3 class="text-lg font-bold text-gray-800">Admin Access</h3>
                <p class="text-xs text-gray-500 mt-1">Enter PIN to access dashboard</p>
            </div>
            <div>
                <input type="password" id="adminPin" placeholder="Enter PIN (Default: 1234)" 
                       class="w-full text-center border-2 border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
                <p id="pinError" class="text-xs text-red-500 font-semibold mt-2 hidden">Incorrect PIN!</p>
            </div>
            <button onclick="checkPin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded text-sm transition-colors">
                Unlock Dashboard
            </button>
        </div>
    </div>

    <!-- 2. Main Admin Dashboard -->
    <div id="adminContent" class="max-w-md mx-auto space-y-6 hidden">
        
        <!-- Header Controls -->
        <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <h1 class="text-sm font-bold text-gray-700">⚙️ Admin Dashboard</h1>
            <a href="index.html" target="_blank" class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1.5 rounded font-semibold border border-emerald-200">
                🌐 View Website
            </a>
        </div>

        <!-- Website Advertisement Settings Card -->
        <div class="bg-white rounded-lg shadow-md p-6 border-2 border-emerald-500/30">
            <h2 class="text-lg font-bold mb-2 text-emerald-700">
                📢 Website Advertisement Settings
            </h2>
            <p class="text-xs text-gray-500 mb-4">A-ADS code yahan paste karein taake website par ads show hoon.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Top Ad Code (Ad 1)</label>
                    <textarea id="adCode1" rows="3" placeholder="Paste A-ADS code here..." class="w-full border border-gray-300 rounded px-3 py-2 text-xs font-mono"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Middle Ad Code (Ad 2 - Between Posts)</label>
                    <textarea id="adCode2" rows="3" placeholder="Paste A-ADS code here..." class="w-full border border-gray-300 rounded px-3 py-2 text-xs font-mono"></textarea>
                </div>
                <button onclick="saveAdsConfig()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2 rounded text-xs transition-colors">
                    💾 Save Ad Settings
                </button>
                <p id="adStatusMsg" class="text-xs text-center font-semibold hidden"></p>
            </div>
        </div>

        <!-- Post New Job Card -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold mb-4 text-emerald-700">
                ➕ Post New Job
            </h2>

            <form id="jobForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Job Title</label>
                    <input type="text" id="jobTitle" required placeholder="e.g. Computer Operator - WAPDA" 
                           class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Category</label>
                    <select id="jobCategory" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                        <option value="Government">Government</option>
                        <option value="Private">Private</option>
                        <option value="Forces">Forces / Police</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Location</label>
                    <input type="text" id="jobLocation" required placeholder="e.g. Lahore, Punjab" 
                           class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Apply Link / Phone / WhatsApp Contact</label>
                    <input type="text" id="jobApplyLink" placeholder="e.g. 03001234567, WhatsApp Link ya Website" 
                           class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-gray-600">Job Details / Description</label>
                    <textarea id="jobDescription" rows="5" required placeholder="Enter eligibility, requirements, last date, etc..." 
                              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded text-sm transition-colors">
                    Publish Job Listing
                </button>
            </form>

            <p id="statusMsg" class="text-xs text-center mt-3 font-semibold hidden"></p>
        </div>

        <!-- Manage / Delete Jobs Card -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-bold mb-3 text-emerald-700">
                🛠️ Manage & Delete Jobs
            </h2>
            <div id="adminJobsList" class="space-y-3">
                <p class="text-xs text-gray-400 text-center py-2">Loading jobs list...</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic using Compat SDK -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AiZaSyDNuCCC577Pul4Gvn3_fX1m23-9tSmsWSo",
            authDomain: "pakjobsalert-fae89.firebaseapp.com",
            projectId: "pakjobsalert-fae89",
            storageBucket: "pakjobsalert-fae89.firebasestorage.app",
            messagingSenderId: "935845790400",
            appId: "1:935845790400:web:98d35b91b94eaeb01ff1a9",
            measurementId: "G-E5C7E37QX2"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentPin = localStorage.getItem('adminPin') || "1234";

        // Check PIN Function
        function checkPin() {
            const inputPin = document.getElementById('adminPin').value;
            const errorMsg = document.getElementById('pinError');
            
            if (inputPin === currentPin) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadAds();
                loadJobs();
            } else {
                errorMsg.innerText = "Incorrect PIN!";
                errorMsg.classList.remove('hidden');
            }
        }

        // Load Ads Configuration
        function loadAds() {
            database.ref('settings/ads').once('value', (snapshot) => {
                if (snapshot.exists()) {
                    const ads = snapshot.val();
                    document.getElementById('adCode1').value = ads.ad1 || '';
                    document.getElementById('adCode2').value = ads.ad2 || '';
                }
            });
        }

        // Save Ads Configuration
        function saveAdsConfig() {
            const ad1 = document.getElementById('adCode1').value;
            const ad2 = document.getElementById('adCode2').value;
            const msg = document.getElementById('adStatusMsg');

            database.ref('settings/ads').set({ ad1, ad2 })
                .then(() => {
                    msg.className = "text-xs text-center font-semibold text-emerald-600 mt-2";
                    msg.innerText = "Ad settings saved successfully!";
                    msg.classList.remove('hidden');
                    setTimeout(() => msg.classList.add('hidden'), 3000);
                })
                .catch((error) => {
                    msg.className = "text-xs text-center font-semibold text-red-600 mt-2";
                    msg.innerText = "Error: " + error.message;
                    msg.classList.remove('hidden');
                });
        }

        // Post Job Form Handler
        document.getElementById('jobForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Publishing...";

            const newJob = {
                title: document.getElementById('jobTitle').value,
                category: document.getElementById('jobCategory').value,
                location: document.getElementById('jobLocation').value,
                applyLink: document.getElementById('jobApplyLink').value,
                description: document.getElementById('jobDescription').value,
                timestamp: Date.now()
            };

            database.ref('jobs').push(newJob)
                .then(() => {
                    statusMsg.className = "text-xs text-center mt-3 font-semibold text-emerald-600";
                    statusMsg.innerText = "Job successfully published!";
                    statusMsg.classList.remove('hidden');
                    document.getElementById('jobForm').reset();
                    setTimeout(() => statusMsg.classList.add('hidden'), 3000);
                })
                .catch((error) => {
                    statusMsg.className = "text-xs text-center mt-3 font-364 text-red-600";
                    statusMsg.innerText = "Error: " + error.message;
                    statusMsg.classList.remove('hidden');
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Publish Job Listing";
                });
        });

        // Load Jobs List for Admin Management
        function loadJobs() {
            database.ref('jobs').on('value', (snapshot) => {
                const container = document.getElementById('adminJobsList');
                container.innerHTML = '';

                if (snapshot.exists()) {
                    let jobsArray = [];
                    snapshot.forEach((childSnapshot) => {
                        jobsArray.push({ id: childSnapshot.key, ...childSnapshot.val() });
                    });
                    
                    jobsArray.sort((a, b) => b.timestamp - a.timestamp);

                    jobsArray.zip = function() {};
                    jobsArray.forEach(job => {
                        const item = document.createElement('div');
                        item.className = "flex justify-between items-center bg-gray-50 border p-3 rounded text-sm";
                        item.innerHTML = `
                            <div class="pr-2 truncate">
                                <h4 class="font-bold text-gray-800 text-xs truncate">${job.title}</h4>
                                <p class="text-[10px] text-gray-500">${job.location} | <span class="text-emerald-600">${job.category}</span></p>
                            </div>
                            <button onclick="deleteJob('${job.id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1 rounded font-semibold shrink-0 transition-colors">
                                Delete
                            </button>
                        `;
                        container.appendChild(item);
                    });
                } else {
                    container.innerHTML = '<p class="text-xs text-gray-400 text-center py-2">No jobs available to manage.</p>';
                }
            });
        }

        // Delete Job Function
        function deleteJob(id) {
            if (confirm("Are you sure you want to delete this job?")) {
                database.ref('jobs/' + id).remove();
            }
        }
    </script>
</body>
</html>
